<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SGE System - Live Overview Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .navbar { background: #0f172a !important; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
        .page-title { font-weight: 700; color: #0f172a; margin-top: 2rem; margin-bottom: 2rem; }
        .cart-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .cart-card:hover { transform: translateY(-2px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .card-header { background: #3b82f6 !important; color: white; border-radius: 12px 12px 0 0 !important; font-weight: 600; }
        .table { margin-bottom: 0; }
        .table thead th { font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.5px; color: #64748b; }
        .price-text { font-weight: 700; color: #10b981; }
        .total-section { font-size: 1.25rem; font-weight: 700; color: #0f172a; }
        .status-badge-container { position: absolute; top: 1.5rem; right: 1.5rem; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="#">🛒 SGE SMART ECOSYSTEM</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link active" href="/">Live Terminal Monitor</a>
            <a class="nav-link" href="/admin">Control Center</a>
        </div>
    </div>
</nav>

<div class="container position-relative py-4">
    <div class="status-badge-container">
        <span id="network-status" class="badge bg-danger p-2 fs-6">🔴 Disconnected</span>
    </div>

    <h2 class="page-title text-center">Live Active Customer Shopping Carts</h2>
    <div class="row g-4" id="monitor-grid"></div>
</div>

<script>
    const socket = io();
    const grid = document.getElementById('monitor-grid');
    const status = document.getElementById('network-status');

    socket.on('connect', () => {
        status.className = "badge bg-success p-2 fs-6";
        status.innerText = "🟢 System Live";
    });

    socket.on('disconnect', () => {
        status.className = "badge bg-danger p-2 fs-6";
        status.innerText = "🔴 Disconnected";
    });

    socket.on('update_event', (data) => {
        grid.innerHTML = '';
        if (!data || Object.keys(data).length === 0) {
            grid.innerHTML = '<div class="col-12 text-center text-muted py-5"><h5>No active weight scaling metrics detected on the floor.</h5><p class="small">Awaiting hardware inputs...</p></div>';
            return;
        }

        for (const [customer, items] of Object.entries(data)) {
            let totalSum = 0;
            let rowsHtml = '';

            items.forEach(item => {
                rowsHtml += `
                    <tr>
                        <td><strong>${item.name}</strong><br><small class="text-muted">via ${item.scale}</small></td>
                        <td class="text-center align-middle">${item.weight.toFixed(0)} g</td>
                        <td class="text-end align-middle price-text">${item.price.toFixed(2)} €</td>
                    </tr>`;
                totalSum += item.price;
            });

            grid.innerHTML += `
                <div class="col-md-6 col-lg-4">
                    <div class="card cart-card">
                        <div class="card-header py-3">👤 Client: ${customer}</div>
                        <div class="card-body p-3">
                            <table class="table table-sm table-borderless">
                                <thead><tr><th>Item Details</th><th class="text-center">Weight</th><th class="text-end">Subtotal</th></tr></thead>
                                <tbody>${rowsHtml}</tbody>
                            </table>
                            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
                                <span class="text-muted small fw-semibold">Grand Total</span>
                                <span class="total-section">${totalSum.toFixed(2)} €</span>
                            </div>
                        </div>
                    </div>
                </div>`;
        }
    });
</script>
</body>
</html>
