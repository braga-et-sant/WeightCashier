<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuickCart — Live Monitor</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --green:      #3C7A42;
            --green-dark: #2A5A2E;
            --navy:       #1B2A47;
            --bg:         #F2F5F8;
            --surface:    #FFFFFF;
            --surface2:   #EDF2F7;
            --outline:    #CBD5E1;
            --muted:      #64748B;
            --font:       "Segoe UI", "Aptos", system-ui, sans-serif;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--navy);
            min-height: 100vh;
            margin: 0;
        }

        /* ── Topbar ──────────────────────────────────── */
        .topbar {
            position: sticky; top: 0; z-index: 200;
            background: var(--surface);
            border-bottom: 1px solid var(--outline);
            padding: 0.7rem 1.5rem;
            display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
        }
        .topbar-brand { display: flex; align-items: center; gap: .6rem; text-decoration: none; }
        .brand-logo   { height: 38px; }
        .topbar-nav   { display: flex; align-items: center; gap: 1.4rem; }
        .topbar-nav a { font-size:.88rem; font-weight:500; color:var(--muted); text-decoration:none; }
        .topbar-nav a:hover { color:var(--navy); }
        .topbar-nav a.active { color:var(--green); font-weight:600; }

        .conn-pill {
            display: inline-flex; align-items: center; gap:.4rem;
            font-size:.78rem; font-weight:700; letter-spacing:.3px;
            padding:.3rem .8rem; border-radius:999px;
            background:var(--navy); color:#fff;
        }
        .conn-dot { width:8px; height:8px; border-radius:50%; background:#ef4444; flex-shrink:0; }
        .conn-pill.live .conn-dot { background:#22c55e; box-shadow:0 0 6px rgba(34,197,94,.7); }

        /* ── Layout ──────────────────────────────────── */
        .page { max-width: 1440px; margin: 0 auto; padding: 1.5rem 1.5rem 4rem; }

        .section-heading {
            font-size:.68rem; font-weight:800; letter-spacing:1.2px;
            text-transform:uppercase; color:var(--muted); margin-bottom:.75rem;
        }

        /* ── Scale cards ─────────────────────────────── */
        .scales-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: .9rem;
            margin-bottom: 2rem;
        }
        .scale-card {
            background: var(--surface);
            border: 1px solid var(--outline);
            border-left: 4px solid var(--outline);
            border-radius: 14px;
            padding: 1rem 1.2rem;
            box-shadow: 0 3px 14px rgba(0,0,0,.06);
            transition: border-color .3s, box-shadow .3s;
        }
        .scale-card.sc-online {
            border-left-color: var(--green);
            box-shadow: 0 4px 20px rgba(60,122,66,.13);
        }
        .scale-card.sc-offline { opacity: .8; }

        .sc-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.55rem; }
        .sc-id   { font-size:.7rem; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); }
        .sc-loc  { font-size:.95rem; font-weight:600; margin-top:.1rem; }

        .conn-badge {
            display: inline-flex; align-items:center; gap:.25rem;
            font-size:.68rem; font-weight:700; padding:.15rem .45rem;
            border-radius:999px; white-space:nowrap;
        }
        .conn-badge .bdot { width:5px; height:5px; border-radius:50%; }
        .cb-online { background:rgba(34,197,94,.13); color:#15803d; border:1px solid rgba(34,197,94,.35); }
        .cb-online .bdot { background:#22c55e; }
        .cb-offline { background:rgba(148,163,184,.12); color:var(--muted); border:1px solid rgba(148,163,184,.35); }
        .cb-offline .bdot { background:#94a3b8; }

        .sc-assigned {
            font-size:.78rem; font-weight:600; color:var(--green-dark);
            margin-top:.4rem; display:flex; align-items:center; gap:.3rem;
        }
        .sc-meta { font-size:.74rem; color:var(--muted); margin-top:.3rem; line-height:1.6; }

        /* ── Stats strip ─────────────────────────────── */
        .stats-strip {
            display: flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1.1rem;
        }
        .stat-chip {
            background:var(--surface); border:1px solid var(--outline);
            border-radius:10px; padding:.4rem 1rem;
            display:flex; align-items:center; gap:.45rem; font-size:.82rem;
        }
        .stat-val { font-size:1.05rem; font-weight:700; color:var(--green); }

        /* ── Carts grid ──────────────────────────────── */
        .carts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.1rem;
        }

        @keyframes slide-in  { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes flash-in  { 0%{ box-shadow:0 0 0 4px rgba(60,122,66,.5); } 100%{ box-shadow:0 6px 24px rgba(0,0,0,.08); } }
        @keyframes row-flash { 0%{ background:#dcfce7; } 100%{ background:transparent; } }

        .cart-card {
            background: var(--surface);
            border: 1px solid var(--outline);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,.07);
            transition: box-shadow .2s;
            animation: slide-in .35s ease both;
        }
        .cart-card:hover { box-shadow: 0 8px 32px rgba(0,0,0,.12); }
        .cart-card.flash { animation: flash-in .85s ease-out forwards; }

        .cart-head {
            background: linear-gradient(135deg, var(--green), var(--green-dark));
            color: #fff; padding: .9rem 1.2rem;
            display: flex; justify-content:space-between; align-items:flex-start;
        }
        .cart-name { font-weight:700; font-size:.97rem; }
        .cart-nif  { font-size:.72rem; opacity:.78; font-family:monospace; margin-top:.1rem; }
        .cart-scale-tag {
            background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.3);
            border-radius:7px; padding:.18rem .55rem;
            font-size:.7rem; font-weight:600; letter-spacing:.3px; white-space:nowrap;
            margin-top:.1rem;
        }

        .cart-table { width:100%; border-collapse:collapse; }
        .cart-table td {
            padding:.48rem 1.2rem; font-size:.85rem;
            border-bottom: 1px solid var(--surface2);
        }
        .cart-table tr:last-child td { border-bottom:none; }
        .cart-table td:nth-child(2) { color:var(--muted); font-size:.78rem; text-align:right; white-space:nowrap; }
        .cart-table td:nth-child(3) { font-weight:600; color:var(--green-dark); text-align:right; white-space:nowrap; }
        .cart-table .item-name { font-weight:500; }
        .row-new { animation: row-flash .9s ease-out forwards; }

        .cart-foot {
            display:flex; justify-content:space-between; align-items:center;
            padding:.65rem 1.2rem; background:var(--surface2);
            border-top:1px solid var(--outline);
        }
        .cart-updated { font-size:.7rem; color:var(--muted); }
        .cart-total   { font-size:1.05rem; font-weight:700; color:var(--navy); }

        .empty-carts {
            grid-column: 1/-1; text-align:center; padding:3rem 2rem;
            background:var(--surface); border-radius:16px;
            border:1.5px dashed var(--outline); color:var(--muted);
        }
        .empty-icon { font-size:2.4rem; margin-bottom:.5rem; }
        .empty-title { font-weight:600; margin-bottom:.25rem; }

        /* ── Feed ────────────────────────────────────── */
        .feed {
            background:var(--surface); border:1px solid var(--outline);
            border-radius:14px; overflow:hidden;
            box-shadow:0 3px 14px rgba(0,0,0,.05); margin-top:2rem;
        }
        .feed-hd {
            padding:.8rem 1.2rem; border-bottom:1px solid var(--outline);
            font-weight:600; font-size:.88rem; display:flex; align-items:center; gap:.4rem;
            color:var(--navy);
        }
        .feed-body { max-height:240px; overflow-y:auto; }
        .feed-row {
            display:grid; grid-template-columns:140px 1fr auto;
            gap:.5rem; align-items:center;
            padding:.45rem 1.2rem; border-bottom:1px solid var(--surface2);
            font-size:.8rem; animation:slide-in .25s ease both;
        }
        .feed-row:last-child { border-bottom:none; }
        .feed-time { color:var(--muted); font-family:monospace; font-size:.74rem; }
        .feed-prod { font-weight:600; }
        .feed-wt   { color:var(--muted); font-size:.76rem; margin-left:.25rem; }
        .feed-sc   { color:var(--muted); font-family:monospace; font-size:.74rem; text-align:right; }
        .feed-empty { padding:1.2rem; text-align:center; color:var(--muted); font-size:.83rem; }

        /* ── Footer ──────────────────────────────────── */
        .page-foot {
            text-align:center; padding:1.25rem; color:var(--muted);
            font-size:.78rem; border-top:1px solid var(--outline); margin-top:1.5rem;
        }
    </style>
</head>
<body>

<!-- Topbar -->
<div class="topbar">
    <a class="topbar-brand" href="/">
        <img class="brand-logo" src="{{ url_for('static', filename='web_logo.png') }}" alt="QuickCart">
    </a>
    <nav class="topbar-nav">
        <a href="/" class="active">Live Monitor</a>
        <a href="/admin">Admin Console</a>
        <div id="conn-pill" class="conn-pill ms-2">
            <span class="conn-dot"></span>
            <span id="conn-label">Connecting…</span>
        </div>
    </nav>
</div>

<!-- Main -->
<div class="page">

    <!-- Scale Stations -->
    <p class="section-heading">Scale Stations</p>
    <div id="scales-row" class="scales-row">
        <div style="color:var(--muted);font-size:.85rem">Loading…</div>
    </div>

    <!-- Stats -->
    <div class="stats-strip">
        <div class="stat-chip">Active customers <span id="s-customers" class="stat-val">0</span></div>
        <div class="stat-chip">Items in carts   <span id="s-items"     class="stat-val">0</span></div>
        <div class="stat-chip">Cart value        <span id="s-total"     class="stat-val">€0.00</span></div>
    </div>

    <!-- Live Carts -->
    <p class="section-heading">Live Shopping Carts</p>
    <div id="carts-grid" class="carts-grid">
        <div class="empty-carts">
            <div class="empty-icon">🛒</div>
            <div class="empty-title">No active carts</div>
            <div style="font-size:.85rem">Carts appear here as customers scan items.</div>
        </div>
    </div>

    <!-- Feed -->
    <div class="feed">
        <div class="feed-hd">⚡ Recent Scale Reads</div>
        <div id="feed-body" class="feed-body">
            <div class="feed-empty">No reads yet.</div>
        </div>
    </div>
</div>

<div class="page-foot">QuickCart Live Monitor</div>
<div class="position-fixed bottom-0 end-0 p-3" id="toast-box" style="z-index:9999"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let carts    = {};   // { "Name (NIF)": [{name,weight,price,scale}, …] }
let cartMeta = {};
let prevKeys = new Set();
let prevCartSnapshot = {}; // for detecting which items are new

// ── DOM ────────────────────────────────────────────────────────────────────
const connPill   = document.getElementById('conn-pill');
const connLabel  = document.getElementById('conn-label');
const scalesRow  = document.getElementById('scales-row');
const cartsGrid  = document.getElementById('carts-grid');
const feedEl     = document.getElementById('feed-body');
const sCustomers = document.getElementById('s-customers');
const sItems     = document.getElementById('s-items');
const sTotal     = document.getElementById('s-total');

// ── Helpers ────────────────────────────────────────────────────────────────
function cardId(customer) {
    return 'cart-' + customer.replace(/[^a-z0-9]/gi, '-');
}

function fmtWeight(g) {
    if (g === 1) return '1 unit';
    if (g >= 1000) return (g / 1000).toFixed(3) + ' kg';
    return g + ' g';
}

function fmtTime(ts) {
    return (ts || '').slice(0, 16).replace('T', ' ');
}

// ── REST ───────────────────────────────────────────────────────────────────
async function loadCarts() {
    try {
        const r = await fetch('/api/carts/active');
        if (!r.ok) return;
        const d = await r.json();
        if (d.status !== 'success') return;
        applyCarts(d.carts || {}, d.meta || {});
        if (d.stats) applyStats(d.stats);
    } catch(e) { console.warn(e); }
}

async function loadScales() {
    try {
        const r = await fetch('/api/scales/status');
        if (!r.ok) return;
        const d = await r.json();
        if (d.status !== 'success') return;
        renderScales(d.scales || []);
        if (Array.isArray(d.recent_reads)) renderFeed(d.recent_reads);
    } catch(e) { console.warn(e); }
}

function loadAll() { loadCarts(); loadScales(); }

// ── Socket.IO ──────────────────────────────────────────────────────────────
const socket = io(window.location.origin, {
    transports: ['polling','websocket'],
    reconnectionDelay: 1000,
    reconnectionDelayMax: 5000
});

function setLive(live) {
    connPill.classList.toggle('live', live);
    connLabel.textContent = live ? 'System Live' : 'Disconnected';
}

socket.on('connect',       () => { setLive(true);  loadAll(); });
socket.on('disconnect',    () => setLive(false));
socket.on('connect_error', () => setLive(false));
socket.on('reconnect',     () => { setLive(true);  loadAll(); });

socket.on('update_event',  (d) => { applyCarts(d || {}, cartMeta); });
socket.on('cart_meta',     (d) => { cartMeta = d || {}; });
socket.on('stats_update',  (d) => { if (d) applyStats(d); });
socket.on('status_update', (d) => { renderScales(d || []); });
socket.on('reads_snapshot',(d) => { renderFeed(d || []); });
socket.on('read_event',    (d) => { if (d) prependFeed(d); });
socket.on('unknown_rfid_event', (d) => {
    if (d) showToast(`Unknown tag <code>${d.rfid}</code> on ${d.scale_id}`);
});

// ── Scales ─────────────────────────────────────────────────────────────────
function renderScales(scales) {
    if (!scales.length) {
        scalesRow.innerHTML = '<div style="color:var(--muted);font-size:.85rem">No scales registered.</div>';
        return;
    }
    scalesRow.innerHTML = scales.map(s => {
        const online  = (s.connectivity || '').toLowerCase() === 'online';
        const sc      = online ? 'sc-online' : 'sc-offline';
        const cb      = online ? 'cb-online'  : 'cb-offline';
        const label   = online ? 'Online' : 'Offline';
        const assigned = s.assigned_nif
            ? `<div class="sc-assigned">👤 ${s.assigned_nif}</div>`
            : `<div class="sc-meta" style="margin-top:.4rem">Unassigned</div>`;
        const hb = s.last_status_age_sec != null
            ? `<div>Heartbeat: ${s.last_status_age_sec}s ago</div>` : '';
        const lr = s.last_reading
            ? `<div>Last read: ${fmtTime(s.last_reading)}</div>` : '';
        return `
        <div class="scale-card ${sc}">
            <div class="sc-top">
                <div>
                    <div class="sc-id">${s.scale_id}</div>
                    <div class="sc-loc">${s.location || '—'}</div>
                </div>
                <span class="conn-badge ${cb}"><span class="bdot"></span>${label}</span>
            </div>
            ${assigned}
            <div class="sc-meta">${hb}${lr}</div>
        </div>`;
    }).join('');
}

// ── Carts ──────────────────────────────────────────────────────────────────
function applyCarts(incoming, meta) {
    // Detect which customers changed or are new
    const changedKeys = new Set();
    Object.keys(incoming).forEach(k => {
        const prev = JSON.stringify(carts[k] || []);
        const next = JSON.stringify(incoming[k] || []);
        if (prev !== next) changedKeys.add(k);
    });

    // Detect new items per customer (for row-level highlight)
    const newItems = {};
    Object.keys(incoming).forEach(k => {
        const prevNames = new Set((carts[k] || []).map(i => i.name + '|' + i.weight));
        newItems[k] = new Set(
            (incoming[k] || [])
                .filter(i => !prevNames.has(i.name + '|' + i.weight))
                .map(i => i.name + '|' + i.weight)
        );
    });

    carts    = incoming;
    cartMeta = meta;
    renderCarts(changedKeys, newItems);
}

function renderCarts(flashKeys = new Set(), newItems = {}) {
    const entries = Object.entries(carts);
    const curKeys = new Set(entries.map(([k]) => k));

    if (entries.length === 0) {
        cartsGrid.innerHTML = `
            <div class="empty-carts">
                <div class="empty-icon">🛒</div>
                <div class="empty-title">No active carts</div>
                <div style="font-size:.85rem">Carts appear here as customers scan items.</div>
            </div>`;
        prevKeys = new Set();
        return;
    }

    // First render from empty
    if (!prevKeys.size) {
        cartsGrid.innerHTML = entries.map(([c, items]) => buildCard(c, items, new Set())).join('');
        prevKeys = curKeys;
        return;
    }

    // Remove departed
    prevKeys.forEach(k => {
        if (!curKeys.has(k)) document.getElementById(cardId(k))?.remove();
    });
    // Clear empty-state if it exists
    cartsGrid.querySelector('.empty-carts')?.remove();

    // Update or insert
    entries.forEach(([customer, items]) => {
        const el = document.getElementById(cardId(customer));
        if (el) {
            patchCard(el, customer, items, flashKeys.has(customer), newItems[customer] || new Set());
        } else {
            const tmp = document.createElement('div');
            tmp.innerHTML = buildCard(customer, items, new Set());
            cartsGrid.appendChild(tmp.firstElementChild);
        }
    });

    prevKeys = curKeys;
}

function buildCard(customer, items, newSet) {
    const scales   = [...new Set(items.map(i => i.scale).filter(Boolean))];
    const scaleTags = scales.map(s => `<span class="cart-scale-tag">${s}</span>`).join(' ');
    const total    = items.reduce((s, i) => s + (i.price || 0), 0);
    const meta     = cartMeta[customer]?.last_update || '';
    const nifMatch = customer.match(/\((\d+)\)/);
    const nif      = nifMatch ? nifMatch[1] : '';
    const name     = customer.replace(/\s*\(\d+\)\s*/, '').trim();

    const rows = items.length
        ? items.map(item => {
            const key = item.name + '|' + item.weight;
            const cls = newSet.has(key) ? 'row-new' : '';
            return `<tr class="${cls}">
                <td class="item-name">${item.name || '—'}</td>
                <td>${fmtWeight(item.weight || 0)}</td>
                <td>€${(item.price || 0).toFixed(2)}</td>
            </tr>`;
        }).join('')
        : `<tr><td colspan="3" style="color:var(--muted);text-align:center;padding:1rem;font-size:.83rem">Cart is empty</td></tr>`;

    return `
    <div class="cart-card" id="${cardId(customer)}">
        <div class="cart-head">
            <div>
                <div class="cart-name">${name}</div>
                <div class="cart-nif">${nif}</div>
            </div>
            <div>${scaleTags}</div>
        </div>
        <table class="cart-table">
            <tbody class="cart-tbody">${rows}</tbody>
        </table>
        <div class="cart-foot">
            <span class="cart-updated">${meta ? 'Updated ' + fmtTime(meta) : ''}</span>
            <span class="cart-total">€${total.toFixed(2)}</span>
        </div>
    </div>`;
}

function patchCard(el, customer, items, flash, newSet) {
    const tbody  = el.querySelector('.cart-tbody');
    const totEl  = el.querySelector('.cart-total');
    const metaEl = el.querySelector('.cart-updated');
    const total  = items.reduce((s, i) => s + (i.price || 0), 0);
    const meta   = cartMeta[customer]?.last_update || '';

    const rows = items.length
        ? items.map(item => {
            const key = item.name + '|' + item.weight;
            const cls = newSet.has(key) ? 'row-new' : '';
            return `<tr class="${cls}">
                <td class="item-name">${item.name || '—'}</td>
                <td>${fmtWeight(item.weight || 0)}</td>
                <td>€${(item.price || 0).toFixed(2)}</td>
            </tr>`;
        }).join('')
        : `<tr><td colspan="3" style="color:var(--muted);text-align:center;padding:1rem;font-size:.83rem">Cart is empty</td></tr>`;

    if (tbody)  tbody.innerHTML  = rows;
    if (totEl)  totEl.textContent  = `€${total.toFixed(2)}`;
    if (metaEl) metaEl.textContent = meta ? 'Updated ' + fmtTime(meta) : '';

    if (flash) {
        el.classList.remove('flash');
        void el.offsetWidth;
        el.classList.add('flash');
        el.addEventListener('animationend', () => el.classList.remove('flash'), { once: true });
    }
}

// ── Stats ──────────────────────────────────────────────────────────────────
function applyStats(s) {
    sCustomers.textContent = s.active_customers ?? 0;
    sItems.textContent     = s.item_count       ?? 0;
    sTotal.textContent     = `€${((s.total_cents || 0) / 100).toFixed(2)}`;
}

// ── Feed ───────────────────────────────────────────────────────────────────
function renderFeed(reads) {
    if (!reads.length) { feedEl.innerHTML = '<div class="feed-empty">No reads yet.</div>'; return; }
    feedEl.innerHTML = '';
    reads.forEach(r => feedEl.appendChild(mkFeedRow(r)));
}

function prependFeed(item) {
    feedEl.querySelector('.feed-empty')?.remove();
    feedEl.insertBefore(mkFeedRow(item), feedEl.firstChild);
    while (feedEl.children.length > 50) feedEl.removeChild(feedEl.lastChild);
}

function mkFeedRow(item) {
    const el = document.createElement('div');
    el.className = 'feed-row';
    const product = item.product_name || `Tag ${item.rfid || '?'}`;
    const wt      = item.weight_grams ? `<span class="feed-wt">· ${fmtWeight(item.weight_grams)}</span>` : '';
    el.innerHTML  = `
        <span class="feed-time">${fmtTime(item.created_at)}</span>
        <span><span class="feed-prod">${product}</span>${wt}</span>
        <span class="feed-sc">${item.scale_id || ''}</span>`;
    return el;
}

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg) {
    const box = document.getElementById('toast-box');
    if (!box) return;
    const t = document.createElement('div');
    t.className = 'toast align-items-center text-bg-dark border-0 show mb-2';
    t.role = 'alert';
    t.innerHTML = `<div class="d-flex"><div class="toast-body">${msg}</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    box.appendChild(t);
    setTimeout(() => t.remove(), 6000);
}

// ── Boot ───────────────────────────────────────────────────────────────────
loadAll();
setInterval(loadAll, 10_000);
</script>
</body>
</html>
